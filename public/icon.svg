<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="FindMyBus">
  <!--
    App icon: the mark on its amber tile. `mark.svg` is the bare mark on
    transparent, and is the asset to reach for when placing the logo in content.

