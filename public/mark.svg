<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="FindMyBus">
  <!--
    The FindMyBus mark: a location pin with a bus cut out of it.

    One path, fill-rule="evenodd", so nesting alternates fill → hole → fill:
      1. pin outline ......... amber
      2. bus body ............ hole (shows whatever is behind)
      3. window band, wheels . amber again

    That is why this renders correctly on any background without a per-ground
    variant. Do not split it back into separate shapes with a background-coloured
    body — that was the flaw in the original drawing.
  -->
  <path fill="#FFB020" fill-rule="evenodd" d="
    M32 5c-11.6 0-21 9.1-21 20.4 0 14.7 17.8 32.6 19.9 34.7a1.6 1.6 0 0 0 2.2 0C35.2 58 53 40.1 53 25.4 53 14.1 43.6 5 32 5Z
    M23 17.5H41A3 3 0 0 1 44 20.5V31.5A3 3 0 0 1 41 34.5H23A3 3 0 0 1 20 31.5V20.5A3 3 0 0 1 23 17.5Z
    M25.5 21H38.5A2 2 0 0 1 40.5 23V26A2 2 0 0 1 38.5 28H25.5A2 2 0 0 1 23.5 26V23A2 2 0 0 1 25.5 21Z
    M23.8 31.5a2.2 2.2 0 1 0 4.4 0 2.2 2.2 0 1 0-4.4 0Z
    M35.8 31.5a2.2 2.2 0 1 0 4.4 0 2.2 2.2 0 1 0-4.4 0Z
  "/>
</svg>
