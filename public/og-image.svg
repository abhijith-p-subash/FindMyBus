<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>

  <!-- Subtle violet radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="600" cy="295" rx="520" ry="360" fill="url(#glow)"/>

  <!-- Top violet bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#7c3aed"/>

  <!-- Decorative dot grid (subtle) -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#3f3f46" opacity="0.6"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.4"/>

  <!-- App name -->
  <text
    x="600" y="258"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="88"
    font-weight="700"
    fill="white"
    letter-spacing="-3">FindMyBus</text>

  <!-- Live indicator -->
  <circle cx="492" cy="324" r="8" fill="#10b981"/>
  <circle cx="492" cy="324" r="14" fill="#10b981" opacity="0.2"/>

  <!-- Tagline -->
  <text
    x="512" y="335"
    text-anchor="start"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="34"
    fill="#a1a1aa"
    letter-spacing="0.5">Live Bus Tracking</text>

  <!-- Divider -->
  <rect x="500" y="378" width="200" height="1" fill="#3f3f46"/>

  <!-- Domain -->
  <text
    x="600" y="426"
    text-anchor="middle"
    font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace"
    font-size="22"
    fill="#7c3aed"
    letter-spacing="0.5"
    opacity="0.9">findmybus.abhijithpsubash.com</text>

  <!-- Bottom accent -->
  <rect x="0" y="625" width="1200" height="5" fill="#7c3aed" opacity="0.35"/>
</svg>
